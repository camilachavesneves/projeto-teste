name: Continuous Integration
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
      - uses: actions/checkout@v6

      - name: Python Lint Code Action
        uses: advanced-security/python-lint-code-scanning-action@v1.1.3
        with:
          linter: pylint